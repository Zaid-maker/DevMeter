name: Pre-Release Extension

on:
  push:
    branches:
      - prerelease
    paths:
      - 'extension/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to marketplaces (yes/no)'
        required: false
        default: 'yes'

jobs:
  prerelease:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: ./extension
        run: bun install

      - name: Bump Pre-Release Version
        working-directory: ./extension
        # Bumps version using a timestamp as the patch version so it's always
        # unique and higher than the stable release (e.g. 0.1.6 → 0.1.1700000000)
        # VS Marketplace requires a standard X.Y.Z version for pre-releases.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Strip any suffixes to get the base version
          BASE=$(echo "$VERSION" | sed 's/-.*//')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          TIMESTAMP=$(date +%s)
          PRE_VERSION="${MAJOR}.${MINOR}.${TIMESTAMP}"
          npm version "$PRE_VERSION" --no-git-tag-version
          echo "PRE_VERSION=$PRE_VERSION" >> "$GITHUB_ENV"

      - name: Build Extension
        working-directory: ./extension
        run: bun run build

      - name: Package Extension (.vsix)
        working-directory: ./extension
        run: npx -y @vscode/vsce package --pre-release --out devmeter-prerelease.vsix

      - name: Upload .vsix Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devmeter-prerelease-vsix
          path: extension/devmeter-prerelease.vsix
          retention-days: 14

      - name: Publish to VS Marketplace (pre-release)
        if: ${{ github.event_name == 'push' || github.event.inputs.publish == 'yes' }}
        working-directory: ./extension
        run: npx -y @vscode/vsce publish --pre-release -p ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX (pre-release)
        if: ${{ github.event_name == 'push' || github.event.inputs.publish == 'yes' }}
        working-directory: ./extension
        run: npx -y ovsx publish --pre-release -p ${{ secrets.OVSX_PAT }}
