name: Pre-Release Extension

on:
  push:
    branches:
      - prerelease
    paths:
      - 'extension/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to marketplaces (yes/no)'
        required: false
        default: 'yes'

jobs:
  prerelease:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: ./extension
        run: bun install

      - name: Bump Pre-Release Version
        working-directory: ./extension
        # Implements Even/Odd minor versioning strategy:
        # Stable releases use EVEN minor versions (e.g., 0.2.x).
        # Pre-releases use ODD minor versions (e.g., 0.3.<timestamp>).
        # This ensures pre-releases are mathematically newer than stable but clearly separated.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BASE=$(echo "$VERSION" | sed 's/-.*//')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          
          # If MINOR is EVEN, increment it to next ODD (e.g. 2 -> 3)
          # If MINOR is already ODD, keep it.
          if (( MINOR % 2 == 0 )); then
            NEW_MINOR=$((MINOR + 1))
          else
            NEW_MINOR=$MINOR
          fi
          
          TIMESTAMP=$(date +%s)
          PRE_VERSION="${MAJOR}.${NEW_MINOR}.${TIMESTAMP}"
          
          npm version "$PRE_VERSION" --no-git-tag-version
          echo "PRE_VERSION=$PRE_VERSION" >> "$GITHUB_ENV"

      - name: Build Extension
        working-directory: ./extension
        run: bun run build

      - name: Package Extension (.vsix)
        working-directory: ./extension
        run: npx -y @vscode/vsce package --pre-release --out devmeter-prerelease.vsix

      - name: Upload .vsix Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devmeter-prerelease-vsix
          path: extension/devmeter-prerelease.vsix
          retention-days: 14

      - name: Publish to VS Marketplace (pre-release)
        if: ${{ github.event_name == 'push' || github.event.inputs.publish == 'yes' }}
        working-directory: ./extension
        run: npx -y @vscode/vsce publish --packagePath devmeter-prerelease.vsix -p ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX (pre-release)
        if: ${{ github.event_name == 'push' || github.event.inputs.publish == 'yes' }}
        working-directory: ./extension
        run: npx -y ovsx publish devmeter-prerelease.vsix -p ${{ secrets.OVSX_PAT }}
