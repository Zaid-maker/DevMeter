name: Auto Bump Extension Version

on:
  push:
    branches:
      - main
    paths:
      - 'extension/**'
      - '!extension/package.json'

jobs:
  bump:
    runs-on: ubuntu-latest
    if: github.event.pusher.name != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Version
        working-directory: ./extension
        run: |
          # Use --no-git-tag-version to avoid npm's internal git handling
          # which often fails in subdirectories in CI
          npm version patch --no-git-tag-version

      - name: Commit and Push changes
        run: |
          git add extension/package.json
          git commit -m "chore(ext): bump version [skip ci]" || echo "No changes to commit"
          git push origin main
