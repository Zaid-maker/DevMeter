services:
  devmeter:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: devmeter-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env
    environment:
      - DATABASE_URL=postgresql://devmeter:devmeter@postgres:5432/devmeter
      - UPSTASH_REDIS_REST_URL=http://redis-http:8079
      - UPSTASH_REDIS_REST_TOKEN=devmeter_local_token
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-http:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: devmeter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devmeter
      POSTGRES_PASSWORD: devmeter
      POSTGRES_DB: devmeter
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmeter"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devmeter-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-http:
    image: hiett/serverless-redis-http:latest
    container_name: devmeter-redis-http
    restart: unless-stopped
    ports:
      - "8079:80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: devmeter_local_token
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
