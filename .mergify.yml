pull_request_rules:
  - name: automatic squash merge for version bump
    conditions:
      - label=automated-bump
      - "#approved-reviews-by>=0"
      - check-success=prerelease-app
      - check-success=bump
    actions:
      queue:
        method: squash
        name: default
      merge:
        method: squash
      delete_head_branch: {}
