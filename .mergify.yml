pull_request_rules:
  - name: automatic squash merge for version bump
    conditions:
      - label=automated-bump
      - "#approved-reviews-by>=0"
      - check-success=prerelease-app # Matches your workflow name
      - check-success=bump # Matches extension auto-bump job
    actions:
      - queue:
          method: squash
          name: default
      - merge:
          method: squash
      - delete_head_branch: {}
